<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flowzyn Agents</title>
<script>try{document.documentElement.setAttribute("data-theme","dark");document.documentElement.style.colorScheme="dark";}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one app. Home lists agents by group; each board opens in place with nav back home and to its siblings. */
  :root {
    /* Light: off-white canvas, white cards lifted by soft shadows, charcoal text, orange only for action and status */
    --bg: #f8f9fa; --card: #ffffff; --line: #e9ecef; --edge: #2d3748; --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    --quiet: #f1f3f5; --fg: #1a1a1a; --muted: #4a5568; --meta: #2d3748;
    --accent: #ff6b00; --accent-hover: #e86100; --accent-strong: #2d3748; --accent-text: #ff6b00; --head: #2d3748; --btn: #2d3748; --bar: #2d3748; --goal: #ff6b00; --plan-line: #ff6b00; --plan-end: #ff6b00; --gl: #2d3748; --plan-goal: #2d3748; --pace-now: #2d3748; --pace-gap: #ff6b00; --goal-hl: #ff6b00; --on-accent: #ffffff;
    --tint: #fff5ed; --tint-fg: #c2410c; --flag-tint: #fff5ed; --ok-bg: #dcfce7; --ok-fg: #15803d; --ok-line: #86efac; --chip: #f1f3f5;
    --pill-bg: #ecfdf3; --pill-fg: #15803d;
    --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #15181f; --line: #2d323d; --edge: #2d323d; --shadow: none; --quiet: #1b1f27; --fg: #f5f3ef; --muted: #9aa0aa; --meta: #d7d9de;
    --accent: #ff6b00; --accent-hover: #ff7d1f; --accent-strong: #ff6b00; --accent-text: #ff6b00; --btn: #f5f3ef; --bar: #6b7280; --goal: #ff6b00; --plan-line: #ff6b00; --plan-end: #ff6b00; --gl: #f5f3ef; --plan-goal: #ff6b00; --pace-now: #6b7280; --pace-gap: #ff6b00; --goal-hl: #ff6b00; --head: #f5f3ef; --on-accent: #ffffff; --tint: rgba(255, 107, 0, 0.12); --tint-fg: #ff6b00; --flag-tint: rgba(255, 107, 0, 0.08); --chip: #1f242d; --pill-bg: #000000; --pill-fg: #ff6b00; --ok-bg: rgba(34, 197, 94, 0.14); --ok-fg: #4ade80; --ok-line: rgba(74, 222, 128, 0.45); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1218; --card: #15181f; --line: #2d323d; --edge: #2d323d; --shadow: none; --quiet: #1b1f27; --fg: #f5f3ef; --muted: #9aa0aa; --meta: #d7d9de;
    --accent: #ff6b00; --accent-hover: #ff7d1f; --accent-strong: #ff6b00; --accent-text: #ff6b00; --btn: #f5f3ef; --bar: #6b7280; --goal: #ff6b00; --plan-line: #ff6b00; --plan-end: #ff6b00; --gl: #f5f3ef; --plan-goal: #ff6b00; --pace-now: #6b7280; --pace-gap: #ff6b00; --goal-hl: #ff6b00; --head: #f5f3ef; --on-accent: #ffffff; --tint: rgba(255, 107, 0, 0.12); --tint-fg: #ff6b00; --flag-tint: rgba(255, 107, 0, 0.08); --chip: #1f242d; --pill-bg: #000000; --pill-fg: #ff6b00; --ok-bg: rgba(34, 197, 94, 0.14); --ok-fg: #4ade80; --ok-line: rgba(74, 222, 128, 0.45); color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
  a { color: var(--accent-strong); }
  a:hover { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .eyebrow, .fz-eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--meta); }
  .util { display: flex; justify-content: flex-end; margin: -16px 0 -14px; }
  .themebtn { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 4px 8px; min-height: 28px; cursor: pointer; }
  .themebtn:hover { color: var(--fg); background: var(--quiet); }
  .themebtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1.home { margin: 0; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
  h1.home b { color: var(--accent-text); }

  /* Home */
  #fz-home { display: flex; flex-direction: column; gap: 24px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { font: 600 14px/1 var(--font); color: var(--fg); background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: 999px; padding: 0 16px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .tab span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tab[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tab[aria-current="true"] span { color: var(--on-accent); }
  .tab:not([aria-current="true"]):hover { border-color: var(--accent); }
  #groups { display: flex; flex-direction: column; gap: 48px; }
  .group, .set { display: flex; flex-direction: column; gap: 12px; }
  .ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .ghead h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .ghead p { margin: 0; font-size: 14px; color: var(--muted); }
  .sub { margin: 8px 0 0; font-size: 12px; font-weight: 700; color: var(--meta); text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--fg); text-decoration: none; }
  .tile.live { border-color: var(--edge); }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tname { font-size: 16px; font-weight: 700; color: var(--muted); }
  .tdo { font-size: 14px; color: var(--muted); line-height: 1.4; }
  .tnum { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 4px; }
  .tnum b { color: var(--fg); font-weight: 600; }
  .step { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .tdo { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.8em; }
  .tval { margin-top: auto; align-self: flex-start; max-width: 100%; box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; line-height: 20px; padding: 2px 10px; border-radius: 999px; background: var(--tint); color: var(--tint-fg); }
  .pill { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; border-radius: 999px; padding: 3px 8px; border: 1px solid var(--pill-bg); background: var(--pill-bg); color: var(--pill-fg); }
  .pill.setup { background: var(--tint); border-color: var(--tint); color: var(--tint-fg); }
  .livebox { display: flex; flex-direction: column; gap: 8px; }
  .livebox h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tile.compact { padding: 10px 14px; gap: 2px; }
  .tile.compact .tdo { display: none; }
  .search { position: relative; max-width: 32rem; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .search input { width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px 0 42px; border: 1px solid var(--accent); box-shadow: var(--shadow); border-radius: 12px; background: var(--card); color: var(--fg); font: 400 16px var(--font); }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .empty { margin: 0; font-size: 15px; color: var(--muted); }

  /* Board */
  #fz-board { display: flex; flex-direction: column; gap: 20px; }
  .fz-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .fz-nav a { text-decoration: none; }
  .fz-navhome, .fz-navgroup { font-size: 14px; font-weight: 600; color: var(--meta) !important; background: none; border: 0; padding: 6px 0; min-height: 32px; display: inline-flex; align-items: center; }
  .fz-navgroup::before { content: "/"; margin: 0 10px; color: var(--muted); font-weight: 400; }
  .fz-btop { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .fz-btop .fz-nav { flex: none; padding-top: 2px; }
  @media (max-width: 640px) { .fz-btop { flex-direction: column; gap: 12px; } .fz-btop .fz-bside { display: contents; } .fz-btop .fz-nav { order: -1; } .fz-btop .fz-play { order: 1; } }
  .fz-navhome:hover, .fz-navgroup:hover, .fz-navhome:focus-visible, .fz-navgroup:focus-visible { color: var(--accent) !important; text-decoration: underline; text-underline-offset: 3px; }
  .fz-nav { gap: 0 !important; }
  .fz-sibs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
  .fz-sib { white-space: nowrap; color: var(--muted); padding: 8px 12px; border-radius: 999px; min-height: 36px; display: inline-flex; align-items: center; }
  .fz-sib:hover { color: var(--fg); }
  .fz-sib.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .fz-bhead { display: flex; flex-direction: column; gap: 6px; }
  .fz-title { margin: 0; font-size: clamp(30px, 4.4vw, 42px); line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; color: var(--fg); }
  #fz-board .fz-status { font-size: clamp(19px, 2.4vw, 24px); }
  .fz-outcome { margin: 0; font-size: 15px; color: var(--muted); max-width: 40rem; }
  .fz-body { display: flex; flex-direction: column; gap: 22px; }
  .fz-loading { color: var(--muted); }
  .fz-status { color: var(--head); margin: 0; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; text-wrap: pretty; }
  .fz-status b { color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .fz-sec { display: flex; flex-direction: column; gap: 10px; }
  .fz-h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .fz-sub { margin: 0; font-size: 14px; color: var(--muted); }
  .fz-cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .fz-card { background: var(--card); border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fz-card.flag { border: 1px solid var(--edge); }
  .fz-card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .fz-card .when { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--meta); }
  .fz-card .who { margin-top: 2px; }
  .fz-card .why { margin-top: 2px; }
  .fz-card .amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fz-card .who { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .fz-card .why { font-size: 14px; color: var(--muted); line-height: 1.4; }
  .fz-card-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .fz-btn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 10px; background: transparent; border: 1.5px solid var(--btn); color: var(--fg) !important; font: 700 15px var(--font); text-decoration: none; cursor: pointer; transition: background .15s ease-out, color .15s ease-out; }
  .fz-btn.act, button.fz-btn:not(.ghost) { border-color: var(--accent); }
  .fz-btn:hover, .fz-btn:focus-visible { background: var(--accent); border-color: var(--accent); color: var(--on-accent) !important; }
  .fz-btn:disabled { opacity: .5; cursor: default; }
  /* Every button: orange border, fills solid orange with white text on hover. Both themes. */
  .fz-draft-head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .fz-draft.inline { border-top: 0; margin-top: 12px; padding-top: 0; gap: 10px; }
  .fz-draft-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .fz-draft-row { display: grid; grid-template-columns: 4.5rem 1fr; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .fz-draft-field { font: 15px var(--font); color: var(--fg); background: var(--card); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .fz-draft-field:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
  .fz-draft-text { width: 100%; box-sizing: border-box; font: 15px/1.5 var(--font); color: var(--fg); background: var(--quiet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; resize: vertical; }
  .fz-draft-text:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
  .fz-draft { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .fz-draft pre { margin: 0; white-space: pre-wrap; font: 400 14px/1.5 var(--font); background: var(--quiet); border-radius: 8px; padding: 10px 12px; }
  .fz-hint { margin: 0; font-size: 12px; color: var(--muted); }
  .fz-more { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .fz-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 10px; }
  .fz-kpi { border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .fz-kpi .l { font-size: 12px; color: var(--muted); }
  .fz-kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--meta); }
  .fz-kpi .s { font-size: 12px; color: var(--muted); }
  .fz-bars { display: flex; flex-direction: column; gap: 8px; }
  .fz-bar { display: grid; grid-template-columns: minmax(0, 12rem) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .fz-bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fz-bar .lab a { color: var(--fg); text-decoration: none; }
  .fz-bar .lab a:hover { color: var(--accent); }
  .fz-bar .track { height: 10px; background: var(--quiet); border-radius: 999px; overflow: hidden; }
  .fz-bar .fill { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
  .fz-bar.hi .fill { background: var(--accent); opacity: 1; }
  .fz-bar .val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5rem; text-align: right; }
  @media (max-width: 520px) { .fz-bar { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; } .fz-bar .lab { grid-column: 1 / -1; white-space: normal; overflow: visible; } }
  .fz-funnel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; align-items: end; min-height: 180px; }
  .fz-step { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 0; }
  .fz-step .col { height: 120px; display: flex; align-items: flex-end; }
  .fz-step .fill { width: 100%; background: var(--bar); border-radius: 6px 6px 0 0; }
  .fz-step.hi .fill { background: var(--accent); opacity: 1; }
  .fz-step .lab { font-size: 12px; color: var(--muted); order: 3; }
  .fz-step .val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; order: 2; }
  .fz-details { border: 1px solid var(--edge); box-shadow: var(--shadow); border-radius: 12px; background: var(--card); }
  .fz-details summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; min-height: 44px; display: flex; align-items: center; }
  .fz-how summary { color: var(--accent-text); font-weight: 700; }
  .fz-how summary:hover { text-decoration: underline; }
  .fz-how[open] summary { margin-bottom: 4px; }
  .fz-details > div { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .fz-details p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .fz-tablebox { overflow-x: auto; }
  .fz-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .fz-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .fz-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .fz-table .num { text-align: right; }
  .fz-tlink { color: inherit; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .fz-tlink:hover { color: var(--accent); text-decoration-color: currentColor; }
  .wm-row .fz-tlink { font-size: 13px; color: var(--meta); }
  .fz-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
  .fz-card.be-mail { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .be-who { display: flex; flex-direction: column; gap: 6px; padding-right: 20px; border-right: 1px solid var(--line); }
  .be-who .be-val { font-weight: 800; font-size: 18px; color: var(--fg); }
  .be-who .be-facts { grid-template-columns: 1fr; gap: 10px; margin-top: 6px; }
  .be-title { display: block; color: var(--muted); font-size: 13px; }
  .be-email .fz-draft { margin-top: 0; }
  .be-email, .be-who { min-width: 0; }
  .qp-kit { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .qp-tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); display: flex; flex-direction: column; gap: 4px; color: var(--fg); text-decoration: none; }
  .qp-tile .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qp-tile .p { font: 800 22px/1.1 var(--font); }
  .qp-tile .u { font-size: 13px; color: var(--muted); }
  .qp-tile .q { align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--accent); }
  .qp-tile.quiet { border-color: var(--accent); }
  a.qp-tile:hover { border-color: var(--accent); }
  .be-who .fz-card-top { flex-direction: column; align-items: flex-start; gap: 4px; }
  .be-who .fz-card-top .amt { font-size: 20px; order: 2; }
  .fz-draft-field, .fz-draft-text { width: 100%; box-sizing: border-box; }
  .fz-draft-text { overflow: hidden; min-height: 140px; }
  @media (max-width: 620px) { .fz-draft-row { grid-template-columns: 1fr; gap: 4px; } .fz-card.be-mail { gap: 14px; } }
  @media (max-width: 760px) { .fz-card.be-mail { grid-template-columns: 1fr; } .be-who { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 14px; } }
  .be-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; margin: 4px 0 2px; }
  .be-facts div { min-width: 0; }
  .be-facts dt { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--meta); }
  .be-facts dd { margin: 2px 0 0; font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
  .fz-cardlink { align-self: center; font-size: 13px; font-weight: 600; color: var(--meta); text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; }
  .fz-cardlink:hover { color: var(--accent); }

<script>
  // Getting smarter and Your network panels: placed into the rendered overview, after the owner's cards and before the How this works footer.
  (function () {
    var box = document.getElementById('fz-overview');
    var tpl = document.getElementById('fz-network-tpl');
    var stpl = document.getElementById('fz-skill-tpl');
    if (!box || !tpl) return;

    // Agent Skill Index, worked out only from records the app keeps: runs/<agent>.history and exceptions.
    var RUNS = {}, EXC = {}, AG = {};
    var DAY = 86400000;
    var NS = 'http://www.w3.org/2000/svg';
    function F() { return window.FZ || {}; }
    function dayIdx(iso) {
      var fmt = F().fmt, k = fmt && fmt.dayKey ? fmt.dayKey(iso) : new Date(iso).toISOString().slice(0, 10);
      var p = k.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY);
    }
    function idxDate(i) { var d = new Date(i * DAY + 18 * 3600000).toISOString(); var fmt = F().fmt; return fmt && fmt.fmtDate ? fmt.fmtDate(d) : d.slice(0, 10); }
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
    function svg(tag, attrs) { var n = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); }); return n; }
    function signed(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }

    function compute() {
      var agents = (F().AGENTS || []).slice();
      var times = {};
      agents.forEach(function (a) {
        var r = RUNS[a.key] || {};
        var list = (r.history || []).slice();
        if (r.last && list.indexOf(r.last) < 0) list.push(r.last);
        times[a.key] = list.filter(Boolean);
      });
      var all = [].concat.apply([], agents.map(function (a) { return times[a.key]; }));
      var today = dayIdx(new Date().toISOString());
      if (!all.length) return { agents: agents, times: times, start: null, today: today, full: 0, weeks: [] };
      var start = Math.min.apply(null, all.map(dayIdx));
      var full = Math.floor((today - start) / 7);
      var wk = function (iso) { return Math.floor((dayIdx(iso) - start) / 7); };
      var weeks = [];
      for (var w = 0; w < full; w++) {
        var per = {}, runsN = 0, okN = 0;
        agents.forEach(function (a) {
          var n = times[a.key].filter(function (t) { return wk(t) === w; }).length;
          if (!n) return;
          var x = Object.keys(EXC).map(function (k) { return EXC[k]; }).filter(function (e) { return e && e.agent === a.key && e.from !== 'owner' && e.createdAt && wk(e.createdAt) === w; }).length;
          var ok = Math.max(0, n - x);
          per[a.key] = { runs: n, handed: x, score: Math.round(ok / n * 100) };
          runsN += n; okN += ok;
        });
        // Only the parts with records count, and the weights are shared out between them.
        weeks.push({ w: w, per: per, runs: runsN, score: runsN ? Math.round(okN / runsN * 100) : null });
      }
      return { agents: agents, times: times, start: start, today: today, full: full, weeks: weeks };
    }

    function chart(host, points, example) {
      // Drawn at the width it shows at, so the labels stay readable on a phone.
      var W = Math.max(280, Math.min(900, Math.round(host.clientWidth) || 640)), H = W < 520 ? 170 : 210, L = 34, R = 16, T = 12, B = 26, lo = 30, hi = 100;
      var x = function (i) { return L + (W - L - R) * (points.length === 1 ? 0.5 : i / (points.length - 1)); };
      var y = function (v) { return T + (H - T - B) * (1 - (Math.max(lo, v) - lo) / (hi - lo)); };
      var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'si-svg' + (example ? ' example' : ''), role: 'img', 'aria-label': example ? 'Example score line, not your numbers' : 'Your Agent Skill Index by week' });
      [40, 60, 80, 100].forEach(function (v) {
        s.appendChild(svg('line', { class: 'grid', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
        var t = svg('text', { class: 'ax', x: L - 8, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v; s.appendChild(t);
      });
      points.forEach(function (p, i) { var t = svg('text', { class: 'ax', x: x(i), y: H - 6, 'text-anchor': 'middle' }); t.textContent = 'Wk ' + p.wk; s.appendChild(t); });
      if (points.length > 1) s.appendChild(svg('polyline', { class: 'ln', points: points.map(function (p, i) { return x(i) + ',' + y(p.v); }).join(' ') }));
      var tip = el('div', 'si-tip'); tip.hidden = true;
      points.forEach(function (p, i) {
        s.appendChild(svg('circle', { class: 'pt', cx: x(i), cy: y(p.v), r: 4 }));
        var hit = svg('circle', { class: 'hit', cx: x(i), cy: y(p.v), r: 14, tabindex: 0 });
        var show = function () {
          var bw = s.getBoundingClientRect(), hw = host.getBoundingClientRect();
          tip.replaceChildren(el('b', null, (example ? 'Example, week ' : 'Week ') + p.wk + ': ' + p.v), el('span', null, example ? 'Not your numbers' : p.note));
          tip.style.left = (bw.left - hw.left + x(i) / W * bw.width) + 'px';
          tip.style.top = (bw.top - hw.top + y(p.v) / H * bw.height) + 'px';
          tip.hidden = false;
        };
        var hide = function () { tip.hidden = true; };
        hit.addEventListener('mouseenter', show); hit.addEventListener('focus', show);
        hit.addEventListener('mouseleave', hide); hit.addEventListener('blur', hide);
        s.appendChild(hit);
      });
      host.append(s, tip);
    }

    function paintSkill() {
      var root = box.querySelector(':scope > #fz-skill');
      if (!root) return;
      var q = function (k) { return root.querySelector('[data-si="' + k + '"]'); };
      var c = compute();
      var scored = c.weeks.filter(function (w) { return w.score != null; });
      var ready = c.full >= 2 && scored.length && scored[scored.length - 1].w === c.full - 1;
      var now = ready ? scored[scored.length - 1] : null;
      root.hidden = !now; // shown only once a real score exists
      var base = ready && scored.length > 1 ? scored[0] : null;
      var firstScore = c.start != null ? idxDate(c.start + 14) : null;

      // Big score, change and when it starts
      var big = q('big'), delta = q('delta'), when = q('when'), lead = root.querySelector('#si-head');
      if (now) {
        big.textContent = String(now.score); big.classList.remove('wait');
        var d = base ? now.score - base.score : null;
        delta.textContent = d == null ? 'Change shows once week 1 is on record' : (d === 0 ? 'No change' : (d > 0 ? 'Up ' : 'Down ') + Math.abs(d)) + ' since week ' + (base.w + 1);
        delta.className = 'si-delta' + (d > 0 ? ' up' : d < 0 ? ' down' : '');
        when.textContent = 'Counted from 1 of 4 parts so far. The others join as they are recorded.';
        lead.replaceChildren('Agent Skill Index: ', el('b', null, String(now.score)));
      } else {
        big.textContent = 'Not yet'; big.classList.add('wait');
        delta.textContent = '';
        when.textContent = c.start == null ? 'Your score starts after your agents’ first full week.'
          : 'Your score starts once your agents have two full weeks on record. Week 1 runs ' + idxDate(c.start) + ' to ' + idxDate(c.start + 6) + ', so your first score and its change show on ' + firstScore + '.';
        lead.replaceChildren('Agent Skill Index ', c.start == null ? 'starts after your first full week' : 'starts ', c.start == null ? '' : el('b', null, firstScore));
      }

      // Chart: your line once there are two full weeks, otherwise a grey example
      var ch = q('chart'); ch.replaceChildren();
      var head = el('div', 'si-chead'); head.append(el('span', null, 'Score by week'));
      if (scored.length >= 2 && ready) {
        ch.append(head);
        chart(ch, scored.map(function (w) { return { wk: w.w + 1, v: w.score, note: w.runs + ' runs counted' }; }), false);
        ch.append(el('p', 'si-cap', 'Your score at the end of each full week.'));
      } else {
        head.append(el('span', 'si-ex', 'EXAMPLE'));
        ch.append(head);
        chart(ch, [48, 52, 55, 57, 61, 64].map(function (v, i) { return { wk: i + 1, v: v }; }), true);
        ch.append(el('p', 'si-cap', 'Example line to show the shape, not your numbers. Your own line starts ' + (firstScore || 'after two full weeks') + '.'));
      }

      // Does it on its own: real counts from the run records
      var own = q('own');
      var runsAll = 0, handedAll = 0, since = null;
      c.agents.forEach(function (a) {
        var t = c.times[a.key]; if (!t.length) return;
        var first = t.slice().sort()[0];
        if (!since || first < since) since = first;
        runsAll += t.length;
        handedAll += Object.keys(EXC).map(function (k) { return EXC[k]; }).filter(function (e) { return e && e.agent === a.key && e.from !== 'owner' && e.createdAt && e.createdAt >= first; }).length;
      });
      if (runsAll) {
        own.textContent = Math.max(0, runsAll - handedAll) + ' of ' + runsAll + ' runs'; own.classList.remove('none');
        own.title = 'Since ' + idxDate(dayIdx(since)) + ': ' + runsAll + ' runs, ' + handedAll + ' handed to a person';
      } else { own.textContent = 'Not counted yet'; own.classList.add('none'); own.removeAttribute('title'); }

      // By agent: the shop's agents as named in the app
      var rows = q('rows');
      if (!rows || !q('moved')) return; // By agent and What moved it were taken off the page
      var list = c.agents.slice().sort(function (a, b) { return c.times[b.key].length - c.times[a.key].length || (b.core ? 1 : 0) - (a.core ? 1 : 0); });
      rows.replaceChildren.apply(rows, list.map(function (a) {
        var r = el('div', 'si-row'), n = el('span', 'n', a.name), tr = el('span', 'track');
        n.title = a.name;
        r.append(n);
        var cur = now && now.per[a.key], b0 = base && base.per[a.key];
        if (cur) {
          r.append(tr);
          var dd = b0 ? cur.score - b0.score : null;
          var f = el('span', 'fill' + (dd != null && dd >= 9 ? ' up' : dd != null && dd < 0 ? ' down' : '')); f.style.width = cur.score + '%'; tr.append(f);
          r.append(el('span', 'sc', String(cur.score)), el('span', 'ch' + (dd > 0 ? ' up' : dd < 0 ? ' down' : ''), dd == null ? 'new' : signed(dd)));
        } else if (c.times[a.key].length) {
          r.append(el('span', 'off', 'Running. Scored from ' + (firstScore || 'week 2')));
        } else if (AG[a.key] && AG[a.key].scheduled && AG[a.key].enabled !== false) {
          var nr = AG[a.key].nextRun, fm = F().fmt;
          r.append(el('span', 'off', 'On. First run ' + (nr && fm && fm.fmtDay ? fm.fmtDay(nr) + ' ' + fm.fmtTime(nr) : 'soon')));
        } else {
          r.classList.add('is-off');
          r.append(el('span', 'off', 'Not switched on yet'));
        }
        return r;
      }));

      // What moved it: point changes with the reason, or what has been counted so far
      var mv = q('moved'); mv.replaceChildren();
      var prev = ready && scored.length > 1 ? scored[scored.length - 2] : null;
      var changes = [];
      if (now && prev) Object.keys(now.per).forEach(function (k) {
        var a = (F().byKey && F().byKey(k)) || { name: k }, p = prev.per[k], cu = now.per[k];
        if (!p) { changes.push({ d: null, a: a, why: 'started running this week, ' + cu.runs + ' runs, ' + (cu.handed ? cu.handed + ' handed to a person' : 'none handed to a person') }); return; }
        var dd = cu.score - p.score; if (!dd) return;
        changes.push({ d: dd, a: a, why: dd > 0 ? 'handed less to a person, ' + cu.handed + ' this week against ' + p.handed + ' last week' : 'handed more to a person, ' + cu.handed + ' this week against ' + p.handed + ' last week' });
      });
      if (changes.length) {
        changes.sort(function (x, y) { return Math.abs(y.d || 0) - Math.abs(x.d || 0); }).forEach(function (x) {
          var row = el('div', 'si-mv'), s = el('span');
          s.append(el('b', null, x.a.name), ' ' + x.why + '.');
          row.append(el('b', x.d > 0 ? 'up' : x.d < 0 ? 'down' : null, x.d == null ? 'New' : signed(x.d)), s); mv.append(row);
        });
      } else {
        mv.append(el('p', 'fz-note', now ? 'No change in points since last week.' : 'No changes yet. The first ones show on ' + (firstScore || 'your second full week') + '.'));
        var so = c.agents.filter(function (a) { return c.times[a.key].length; });
        if (so.length) {
          mv.append(el('h3', 'ov-h3', 'Counted so far'));
          var wrap = el('div');
          so.forEach(function (a) {
            var t = c.times[a.key], first = t.slice().sort()[0];
            var x = Object.keys(EXC).map(function (k) { return EXC[k]; }).filter(function (e) { return e && e.agent === a.key && e.from !== 'owner' && e.createdAt && e.createdAt >= first; }).length;
            var row = el('div', 'si-mv'), s = el('span');
            s.append(el('b', null, a.name), ' ran on its own since ' + idxDate(dayIdx(first)) + '. ' + (x ? x + ' handed to a person.' : 'Nothing handed to a person.'));
            row.append(el('b', null, t.length + (t.length === 1 ? ' run' : ' runs')), s); wrap.append(row);
          });
          mv.append(wrap);
        }
      }
    }

    function place() {
      if (!box.querySelector(':scope > .ov-card')) return;
      if (!box.querySelector(':scope > #fz-network')) {
        var foot = box.querySelector(':scope > .fz-how, :scope > .fz-source');
        var node = tpl.content.firstElementChild.cloneNode(true);
        if (foot) box.insertBefore(node, foot); else box.appendChild(node);
      }
      if (stpl && !box.querySelector(':scope > #fz-skill')) {
        box.insertBefore(stpl.content.firstElementChild.cloneNode(true), box.querySelector(':scope > #fz-network'));
        try { paintSkill(); } catch (e) { console.error(e); }
      }
    }
    new MutationObserver(place).observe(box, { childList: true });
    place();

    // Read only: run records and exceptions, the same collections the app already reads.
    (async function () {
      try {
        var db = window.claude && window.claude.use ? await window.claude.use('db') : null;
        if (!db) return;
        var repaint = function () { try { paintSkill(); } catch (e) { console.error(e); } };
        try { db.collection('runs').onSnapshot(function (snap) { (snap.docs || []).forEach(function (d) { RUNS[d.id] = d.data(); }); repaint(); }); } catch (e) { /* the panel keeps its empty state */ }
        try { db.collection('exceptions').onSnapshot(function (snap) { Object.keys(EXC).forEach(function (k) { delete EXC[k]; }); (snap.docs || []).forEach(function (d) { EXC[d.id] = d.data(); }); repaint(); }); } catch (e) { /* counts runs only */ }
        try { db.collection('agents').onSnapshot(function (snap) { (snap.docs || []).forEach(function (d) { AG[d.id] = d.data(); }); repaint(); }); } catch (e) { /* rows keep their run state */ }
      } catch (e) { /* the panel keeps its empty state */ }
    })();
  })();
</script>

</body></html>
